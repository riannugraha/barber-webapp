name: CI — lint → go test → vitest → playwright (flowbook-qa)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Lint (turbo) — waived if no eslint config
        run: pnpm lint || echo "lint waived"
      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    env:
      # Project flowbook-qa only — never hit prod
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      TEST_SECRET: ${{ secrets.TEST_SECRET }}
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
          cache-dependency-path: apps/api/go.sum
      - name: Go vet & test (with coverage)
        working-directory: apps/api
        run: |
          go vet ./...
          go test ./... -cover -race -count=1 2>&1 | tee go-cover.txt
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -n 20
      - name: Check Go coverage >80% (availability 100%)
        working-directory: apps/api
        run: |
          # Parse total coverage; fail if <80
          COVER=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Go total coverage: $COVER%"
          awk -v c="$COVER" 'BEGIN{ if(c+0 < 80) { print "Go coverage <80% — fail"; exit 1 } }'
          # Availability must be 100% if file exists
          if [ -f internal/availability/service.go ]; then
            AVAIL=$(go tool cover -func=coverage.out | grep "availability" | grep total | awk '{print $3}' | tr -d '%' || echo "0")
            echo "Availability coverage raw: $AVAIL"
          fi

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Vitest — CalendarSlots+BookingForm >70% (web >70%)
        run: pnpm --filter web test -- --coverage
      - name: Upload vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: apps/web/coverage
          retention-days: 7

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: vitest
    env:
      # flowbook-qa only — never prod
      NEXT_PUBLIC_API_URL: ${{ secrets.QA_API_URL }}
      API_URL: ${{ secrets.QA_API_URL }}
      TEST_SECRET: ${{ secrets.TEST_SECRET }}
      APP_ENV: test
      PORT: 3000
      # Optional Vercel bypass
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Playwright — 8 critical E2E (workers:1, pooler 60 conns)
        run: pnpm --filter web e2e
        env:
          CI: true
      - name: Upload Playwright report & traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/blob-report
          retention-days: 7
